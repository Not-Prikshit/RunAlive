version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: runalive_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runalive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runalive_dev}
      POSTGRES_DB: ${POSTGRES_DB:-runalive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runalive}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: runalive_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres_data:
